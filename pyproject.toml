[project]
name = "oss-refusal-evaluation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.8.0",
    "matplotlib>=3.10.8",
    "numpy>=2.2.0",
    "orjson>=3.11.9",
    "pyyaml>=6.0.3",
    "vllm>=0.21.0",
]

# vllm 0.21 supports transformers 5.x natively. Override ensures latest
# for Qwen3.5 model support (mrope_section, mrope_interleaved keys).
[tool.uv]
constraint-dependencies = []
override-dependencies = [
    "transformers>=5.8.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]
